<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Physics Quiz - Linear Operators & Special Matrices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback.hint {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .solution {
            background: #e7f3ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid #2196F3;
            display: none;
        }

        .solution h3 {
            color: #2196F3;
            margin-bottom: 10px;
        }

        .solution-content {
            line-height: 1.8;
            color: #333;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .hidden {
            display: none;
        }

        .math-display {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Engineering Physics Quiz</h1>
        <div class="subtitle">BAPHY105: Linear Operators & Special Matrices</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="current-question">1</div>
                <div class="stat-label">Current Question</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="attempts">0</div>
                <div class="stat-label">Attempts</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress" style="width: 0%"></div>
        </div>

        <div id="quiz-content">
            <!-- Quiz content will be injected here -->
        </div>

        <div id="completion-screen" class="hidden">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">🎉 Quiz Completed!</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="final-score">0</div>
                    <div class="stat-label">Final Score</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-questions">0</div>
                    <div class="stat-label">Total Questions</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
            </div>
        </div>
    </div>

    <script>
        // Quiz data structure (easy answers: mostly A/B/C/D + a few numeric)
        const quizData = [
            {
                question:
                    "MCQ: Which option correctly states the condition for a linear operator A?<br><br>" +
                    "A) A(|ψ⟩|φ⟩) = A|ψ⟩ A|φ⟩<br>" +
                    "B) A(α|ψ⟩ + β|φ⟩) = αA|ψ⟩ + βA|φ⟩ for all α, β<br>" +
                    "C) A|ψ⟩ = |ψ⟩ for all |ψ⟩<br>" +
                    "D) A†A = I<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "B",
                acceptedAnswers: ["b", "B"],
                hints: [
                    "Linearity means the operator respects addition and scalar multiplication.",
                    "Pick the option where α and β can be pulled out."
                ],
                solution:
                    "Correct option: B\\n\\n" +
                    "A is linear if it satisfies:\\n" +
                    "A(α|ψ⟩ + β|φ⟩) = αA|ψ⟩ + βA|φ⟩ for all scalars α, β.\\n\\n" +
                    "This combines additivity and homogeneity.",
                topic: "Linear Operators"
            },
            {
                question:
                    "Numerical: For the 2×2 matrix A = [[2,1],[1,2]], enter its eigenvalues in the format: 1,3",
                correctAnswer: "1,3",
                acceptedAnswers: ["1,3", "3,1"],
                hints: [
                    "Use det(A − λI) = 0.",
                    "You will get λ² − 4λ + 3 = 0."
                ],
                solution:
                    "det(A − λI)=0 gives:\\n" +
                    "(2−λ)² − 1 = 0 → λ² − 4λ + 3 = 0 → (λ−1)(λ−3)=0.\\n\\n" +
                    "Eigenvalues: 1 and 3.\\nType: 1,3",
                topic: "Eigenvalues (2×2)"
            },
            {
                question:
                    "MCQ: Which equation defines a Hermitian operator H?<br><br>" +
                    "A) H†H = I<br>" +
                    "B) H = H†<br>" +
                    "C) H² = I<br>" +
                    "D) det(H) = 1<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "B",
                acceptedAnswers: ["b", "B"],
                hints: [
                    "Hermitian means equal to its adjoint (conjugate transpose).",
                    "Look for the option that says H equals H dagger."
                ],
                solution:
                    "Correct option: B\\n\\n" +
                    "Hermitian (self-adjoint) means H = H†.",
                topic: "Hermitian Operators"
            },
            {
                question:
                    "MCQ: If A and B are Hermitian, what is the nature of the commutator [A,B] = AB − BA?<br><br>" +
                    "A) Hermitian<br>" +
                    "B) Anti-Hermitian (skew-Hermitian)<br>" +
                    "C) Unitary<br>" +
                    "D) Symmetric<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "B",
                acceptedAnswers: ["b", "B"],
                hints: [
                    "Take the adjoint of (AB − BA).",
                    "Use (AB)† = B†A†, with A†=A and B†=B."
                ],
                solution:
                    "Correct option: B\\n\\n" +
                    "([A,B])† = (AB − BA)† = B†A† − A†B† = BA − AB = −[A,B].\\n" +
                    "So [A,B] is anti-Hermitian (skew-Hermitian).",
                topic: "Commutators"
            },
            {
                question:
                    "MCQ: If U is unitary and U|χ⟩ = λ|χ⟩, what is |λ|?<br><br>" +
                    "A) 0<br>" +
                    "B) 1<br>" +
                    "C) 2<br>" +
                    "D) Depends on |χ⟩<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "B",
                acceptedAnswers: ["b", "B"],
                hints: [
                    "Unitary means U†U = I.",
                    "Compute ⟨χ|U†U|χ⟩ in two ways."
                ],
                solution:
                    "Correct option: B\\n\\n" +
                    "For unitary U, eigenvalues are unimodular, so |λ| = 1.",
                topic: "Unitary Operators"
            },
            {
                question:
                    "MCQ: Which pair of conditions defines a projection operator P?<br><br>" +
                    "A) P² = I and P = P†<br>" +
                    "B) P² = P and P = P†<br>" +
                    "C) P†P = I and det(P)=1<br>" +
                    "D) P² = 0 and P = −P†<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "B",
                acceptedAnswers: ["b", "B"],
                hints: [
                    "Projection twice should be the same as projection once.",
                    "Also, it should be Hermitian."
                ],
                solution:
                    "Correct option: B\\n\\n" +
                    "A projection operator satisfies:\\n" +
                    "1) Idempotent: P² = P\\n" +
                    "2) Hermitian: P = P†",
                topic: "Projection Operators"
            },
            {
                question:
                    "MCQ: In the identity [σx, σy] = 2i σ?, which Pauli matrix appears?<br><br>" +
                    "A) σx<br>" +
                    "B) σy<br>" +
                    "C) σz<br>" +
                    "D) I (identity)<br><br>" +
                    "Type: A / B / C / D",
                correctAnswer: "C",
                acceptedAnswers: ["c", "C"],
                hints: [
                    "The commutator cycles x → y → z.",
                    "Standard result: [σx, σy] = 2iσz."
                ],
                solution:
                    "Correct option: C\\n\\n" +
                    "[σx, σy] = 2iσz.",
                topic: "Pauli Matrices"
            },
            {
                question:
                    "True/False: For a Hermitian operator, eigenvectors with distinct eigenvalues are orthogonal.<br><br>Type: True or False",
                correctAnswer: "true",
                acceptedAnswers: ["true", "True", "t", "T"],
                hints: [
                    "Use ⟨χj|H|χi⟩ computed in two ways.",
                    "Hermitian implies ⟨χj|H|χi⟩ = ⟨Hχj|χi⟩."
                ],
                solution:
                    "True\\n\\n" +
                    "For Hermitian operators, eigenvectors corresponding to distinct eigenvalues are orthogonal.",
                topic: "Hermitian Spectral Property"
            },
            {
                question:
                    "Short: What is the trace of σx, σy, and σz? (Enter a single number)",
                correctAnswer: "0",
                acceptedAnswers: ["0", "zero", "Zero"],
                hints: [
                    "Trace = sum of diagonal elements.",
                    "Each Pauli matrix has diagonals that add to zero."
                ],
                solution:
                    "Tr(σx)=0, Tr(σy)=0, Tr(σz)=0.\\nSo the answer is 0.",
                topic: "Pauli Matrices"
            },
            {
                question:
                    "Short: Eigenvalues of σz are +1 and −1. Type them in the format: 1,-1",
                correctAnswer: "1,-1",
                acceptedAnswers: ["1,-1", "-1,1", "1,−1", "−1,1"],
                hints: [
                    "σz is diagonal with entries 1 and −1.",
                    "Diagonal entries of a diagonal matrix are its eigenvalues."
                ],
                solution:
                    "σz = [[1,0],[0,−1]], so eigenvalues are 1 and −1.\\nType: 1,-1",
                topic: "Pauli Matrices"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attempts = 0;
        let hintIndex = 0;

        function normalizeAnswer(s) {
            // Lowercase, trim, collapse spaces, and normalize spaces around commas
            return s
                .toLowerCase()
                .trim()
                .replace(/\s+/g, " ")
                .replace(/\s*,\s*/g, ",");
        }

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showCompletionScreen();
                return;
            }

            const question = quizData[currentQuestionIndex];
            hintIndex = 0;

            const quizContent = document.getElementById('quiz-content');
            quizContent.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${quizData.length} | Topic: ${question.topic}</div>
                    <div class="question-text">${question.question}</div>
                    <input type="text" class="answer-input" id="answer-input" placeholder="Enter your answer here..." />
                    <div>
                        <button class="btn btn-primary" onclick="checkAnswer()">Submit Answer</button>
                        <button class="btn btn-secondary" onclick="skipQuestion()">Skip Question</button>
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="solution" id="solution">
                        <h3>📖 Full Solution</h3>
                        <div class="solution-content">${formatSolution(question.solution)}</div>
                    </div>
                </div>
            `;

            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            updateProgress();

            document.getElementById('answer-input').focus();

            document.getElementById('answer-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkAnswer();
            });
        }

        function formatSolution(solution) {
            return solution.split('\\n').map(line => {
                if (line.trim().startsWith('Step') || line.trim().startsWith('•') || line.trim().match(/^\\d+\\./)) {
                    return `<p style="margin: 8px 0; padding-left: 10px;"><strong>${line}</strong></p>`;
                }
                return `<p style="margin: 8px 0;">${line}</p>`;
            }).join('');
        }

        function checkAnswer() {
            const userAnswer = normalizeAnswer(document.getElementById('answer-input').value);
            const question = quizData[currentQuestionIndex];
            const feedback = document.getElementById('feedback');

            if (!userAnswer) {
                feedback.className = 'feedback incorrect';
                feedback.style.display = 'block';
                feedback.innerHTML = '⚠️ Please enter an answer!';
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = attempts;

            // Exact match only (prevents accidental partial matches)
            const isCorrect = question.acceptedAnswers
                .map(a => normalizeAnswer(a))
                .some(a => a === userAnswer);

            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.className = 'feedback correct';
                feedback.style.display = 'block';
                feedback.innerHTML = "✅ <strong>Correct!</strong> Well done! Here's the complete solution:";

                document.getElementById('solution').style.display = 'block';

                document.querySelector('.btn-primary').textContent = 'Next Question →';
                document.querySelector('.btn-primary').onclick = nextQuestion;
                document.querySelector('.btn-secondary').style.display = 'none';

            } else {
                if (hintIndex < question.hints.length) {
                    feedback.className = 'feedback hint';
                    feedback.style.display = 'block';
                    feedback.innerHTML = `💡 <strong>Hint ${hintIndex + 1}:</strong> ${question.hints[hintIndex]}`;
                    hintIndex++;
                } else {
                    feedback.className = 'feedback incorrect';
                    feedback.style.display = 'block';
                    feedback.innerHTML = "❌ <strong>Incorrect.</strong> Here's the complete solution:";
                    document.getElementById('solution').style.display = 'block';

                    document.querySelector('.btn-primary').textContent = 'Next Question →';
                    document.querySelector('.btn-primary').onclick = nextQuestion;
                    document.querySelector('.btn-secondary').style.display = 'none';
                }
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function skipQuestion() {
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback hint';
            feedback.style.display = 'block';
            feedback.innerHTML = "⏭️ <strong>Question skipped.</strong> Here's the solution for your reference:";
            document.getElementById('solution').style.display = 'block';

            document.querySelector('.btn-primary').textContent = 'Next Question →';
            document.querySelector('.btn-primary').onclick = nextQuestion;
            document.querySelector('.btn-secondary').style.display = 'none';
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function showCompletionScreen() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('total-questions').textContent = quizData.length;
            document.getElementById('progress').style.width = '100%';
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            attempts = 0;
            hintIndex = 0;

            document.getElementById('score').textContent = '0';
            document.getElementById('attempts').textContent = '0';
            document.getElementById('quiz-content').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('hidden');

            loadQuestion();
        }

        // Initialize quiz on page load
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
