<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Physics Quiz - Linear Operators & Special Matrices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback.hint {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .solution {
            background: #e7f3ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid #2196F3;
            display: none;
        }

        .solution h3 {
            color: #2196F3;
            margin-bottom: 10px;
        }

        .solution-content {
            line-height: 1.8;
            color: #333;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .hidden {
            display: none;
        }

        .math-display {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Engineering Physics Quiz</h1>
        <div class="subtitle">BAPHY105: Linear Operators & Special Matrices</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="current-question">1</div>
                <div class="stat-label">Current Question</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="attempts">0</div>
                <div class="stat-label">Attempts</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress" style="width: 0%"></div>
        </div>

        <div id="quiz-content">
            <!-- Quiz content will be injected here -->
        </div>

        <div id="completion-screen" class="hidden">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">🎉 Quiz Completed!</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="final-score">0</div>
                    <div class="stat-label">Final Score</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-questions">0</div>
                    <div class="stat-label">Total Questions</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
            </div>
        </div>
    </div>

    <script>
        // Quiz data structure
        const quizData = [
            {
                question: "What is the condition for an operator Â to be linear?",
                correctAnswer: "Â(α|ψ⟩ + β|φ⟩) = αÂ|ψ⟩ + βÂ|φ⟩",
                acceptedAnswers: ["linear", "linearity preserved", "preserves linearity"],
                hints: [
                    "Think about how the operator acts on a linear combination of vectors. Does it preserve scalar multiplication and addition?",
                    "The operator must satisfy: Â(α|ψ⟩ + β|φ⟩) = αÂ|ψ⟩ + βÂ|φ⟩ for all scalars α, β"
                ],
                solution: "A linear operator preserves linearity during its operation.\n\nMathematically: Â(α|ψ⟩ + β|φ⟩) = αÂ|ψ⟩ + βÂ|φ⟩\n\nThis means:\n1. The operator preserves scalar multiplication\n2. The operator preserves vector addition\n\nExample: d/dx is linear because d/dx(sin x + cos x) = d/dx(sin x) + d/dx(cos x)\nCounter-example: √ is non-linear because √(A + B) ≠ √A + √B",
                topic: "Linear Operators"
            },
            {
                question: "For a 2×2 matrix A = [[2,1],[1,2]], what are its eigenvalues?",
                correctAnswer: "λ = 1, 3",
                acceptedAnswers: ["1 and 3", "3 and 1", "1, 3", "3, 1", "lambda = 1 and 3"],
                hints: [
                    "Use the characteristic equation: det(A - λI) = 0. This will give you a polynomial in λ.",
                    "det([[2-λ, 1],[1, 2-λ]]) = 0 leads to (2-λ)² - 1 = 0, which simplifies to λ² - 4λ + 3 = 0"
                ],
                solution: "To find eigenvalues, solve det(A - λI) = 0\n\nStep 1: Set up characteristic equation\ndet([[2-λ, 1],[1, 2-λ]]) = 0\n\nStep 2: Calculate determinant\n(2-λ)(2-λ) - (1)(1) = 0\n4 - 4λ + λ² - 1 = 0\nλ² - 4λ + 3 = 0\n\nStep 3: Factor or use quadratic formula\n(λ - 1)(λ - 3) = 0\n\nAnswer: λ = 1 and λ = 3\n\nThe eigenvectors are |ψ₁⟩ ∝ [1,1] for λ=3 and |ψ₂⟩ ∝ [1,-1] for λ=1",
                topic: "Eigenvalues"
            },
            {
                question: "What is the defining property of a Hermitian operator Ĥ?",
                correctAnswer: "Ĥ = Ĥ†",
                acceptedAnswers: ["hermitian", "self-adjoint", "Ĥ† = Ĥ", "equal to its adjoint"],
                hints: [
                    "A Hermitian operator is also called a self-adjoint operator. Think about its relationship with its adjoint.",
                    "The operator must equal its own adjoint (conjugate transpose): Ĥ = Ĥ†"
                ],
                solution: "A Hermitian operator is self-adjoint: Ĥ = Ĥ†\n\nIn matrix form: A_ij = A*_ji (each element equals the complex conjugate of its transpose)\n\nKey Properties:\n1. All eigenvalues are REAL\n2. Eigenvectors corresponding to distinct eigenvalues are ORTHOGONAL\n\nPhysical significance: In quantum mechanics, all observable quantities are represented by Hermitian operators because measurements must yield real values.\n\nExample: The Pauli matrices σₓ, σᵧ, σᵤ are all Hermitian.",
                topic: "Hermitian Operators"
            },
            {
                question: "If two Hermitian operators  and B̂ don't commute, what is the nature of their commutator [Â,B̂]?",
                correctAnswer: "skew-Hermitian",
                acceptedAnswers: ["skew-hermitian", "anti-hermitian", "skew hermitian"],
                hints: [
                    "Take the adjoint of [Â,B̂] = ÂB̂ - B̂Â. Use the fact that (ÂB̂)† = B̂†Â† and that both operators are Hermitian.",
                    "Since  = Â† and B̂ = B̂†, you'll find that [Â,B̂]† = -[Â,B̂], which is the definition of skew-Hermitian."
                ],
                solution: "Proof that [Â,B̂] is skew-Hermitian when  and B̂ are Hermitian:\n\nStep 1: Take adjoint of commutator\n[Â,B̂]† = (ÂB̂ - B̂Â)†\n      = (ÂB̂)† - (B̂Â)†\n      = B̂†Â† - Â†B̂†\n\nStep 2: Use Hermiticity ( = Â†, B̂ = B̂†)\n      = B̂Â - ÂB̂\n      = -(ÂB̂ - B̂Â)\n      = -[Â,B̂]\n\nSince [Â,B̂]† = -[Â,B̂], the commutator is skew-Hermitian.\n\nThis has important implications: eigenvalues of [Â,B̂] are purely imaginary or zero!",
                topic: "Hermitian Operators - Commutators"
            },
            {
                question: "What is the modulus of each eigenvalue of a unitary operator?",
                correctAnswer: "|λ| = 1",
                acceptedAnswers: ["1", "unity", "one", "|λ| = 1"],
                hints: [
                    "For a unitary operator Û, we have Û†Û = I. If Û|χ⟩ = λ|χ⟩, what happens when you compute ⟨χ|Û†Û|χ⟩?",
                    "⟨χ|Û†Û|χ⟩ = ⟨χ|I|χ⟩ = ⟨χ|χ⟩, but also equals λ*λ⟨χ|χ⟩ = |λ|²⟨χ|χ⟩"
                ],
                solution: "Proof that |λ| = 1 for unitary operators:\n\nGiven: Û is unitary, so Û†Û = I\nAlso: Û|χ⟩ = λ|χ⟩\n\nStep 1: Take adjoint\n⟨χ|Û† = ⟨χ|λ*\n\nStep 2: Compute ⟨χ|Û†Û|χ⟩\n⟨χ|Û†Û|χ⟩ = ⟨χ|λ*λ|χ⟩ = |λ|²⟨χ|χ⟩\n\nStep 3: Use unitarity\n⟨χ|I|χ⟩ = ⟨χ|χ⟩\n\nStep 4: Equate\n|λ|²⟨χ|χ⟩ = ⟨χ|χ⟩\n\nTherefore: |λ| = 1\n\nPhysical meaning: Unitary operators preserve the norm (length) of vectors, representing symmetry transformations in quantum mechanics.",
                topic: "Unitary Operators"
            },
            {
                question: "What are the two conditions for an operator P̂ to be a projection operator?",
                correctAnswer: "Hermitian and Idempotent (P̂² = P̂)",
                acceptedAnswers: ["hermitian and idempotent", "idempotent and hermitian", "P̂² = P̂ and hermitian"],
                hints: [
                    "One condition relates to how the operator behaves when applied to itself (think about projecting twice).",
                    "The operator must be: (1) Hermitian (P̂ = P̂†) and (2) Idempotent (P̂² = P̂)"
                ],
                solution: "A projection operator P̂ must satisfy TWO conditions:\n\n1. HERMITIAN: P̂ = P̂†\n   (The operator is self-adjoint)\n\n2. IDEMPOTENT: P̂² = P̂\n   (Applying the projection twice gives the same result as once)\n\nExample: P̂ = |u⟩⟨u| (where |u⟩ is normalized)\n\nVerification:\n• (|u⟩⟨u|)† = |u⟩⟨u| ✓ (Hermitian)\n• (|u⟩⟨u|)² = |u⟩⟨u|u⟩⟨u| = |u⟩⟨u| ✓ (Idempotent, since ⟨u|u⟩=1)\n\nPhysical meaning: Measuring a quantum state twice in succession gives the same result as measuring once.",
                topic: "Projection Operators"
            },
            {
                question: "What is the commutation relation [σₓ, σᵧ] for Pauli matrices?",
                correctAnswer: "2iσᵤ",
                acceptedAnswers: ["2i σz", "2iσz", "2i σᵤ"],
                hints: [
                    "Calculate σₓσᵧ and σᵧσₓ using the matrix representations: σₓ=[[0,1],[1,0]] and σᵧ=[[0,-i],[i,0]]",
                    "When you compute σₓσᵧ - σᵧσₓ, you should get 2i times the third Pauli matrix σᵤ"
                ],
                solution: "Calculating [σₓ, σᵧ]:\n\nStep 1: Recall Pauli matrices\nσₓ = [[0,1],[1,0]]\nσᵧ = [[0,-i],[i,0]]\nσᵤ = [[1,0],[0,-1]]\n\nStep 2: Calculate σₓσᵧ\nσₓσᵧ = [[0,1],[1,0]][[0,-i],[i,0]] = [[i,0],[0,-i]]\n\nStep 3: Calculate σᵧσₓ\nσᵧσₓ = [[0,-i],[i,0]][[0,1],[1,0]] = [[-i,0],[0,i]]\n\nStep 4: Find commutator\n[σₓ,σᵧ] = σₓσᵧ - σᵧσₓ = [[i,0],[0,-i]] - [[-i,0],[0,i]] = [[2i,0],[0,-2i]] = 2iσᵤ\n\nGeneral pattern:\n[σᵢ,σⱼ] = 2iεᵢⱼₖσₖ (where εᵢⱼₖ is the Levi-Civita symbol)\n\nAlso: Pauli matrices ANTI-COMMUTE: {σₓ,σᵧ} = σₓσᵧ + σᵧσₓ = 0",
                topic: "Pauli Matrices"
            },
            {
                question: "True or False: Eigenvectors corresponding to distinct eigenvalues of a Hermitian operator are orthogonal.",
                correctAnswer: "True",
                acceptedAnswers: ["true", "yes", "correct"],
                hints: [
                    "Consider ⟨χⱼ|Ĥ|χᵢ⟩ where Ĥ|χᵢ⟩ = λᵢ|χᵢ⟩ and Ĥ|χⱼ⟩ = λⱼ|χⱼ⟩ with λᵢ ≠ λⱼ",
                    "Compare ⟨χⱼ|Ĥ|χᵢ⟩ = λᵢ⟨χⱼ|χᵢ⟩ with its adjoint form, using that Ĥ is Hermitian"
                ],
                solution: "TRUE - Eigenvectors of distinct eigenvalues of Hermitian operators are orthogonal.\n\nProof:\nLet Ĥ be Hermitian with Ĥ|χᵢ⟩ = λᵢ|χᵢ⟩ and Ĥ|χⱼ⟩ = λⱼ|χⱼ⟩ where λᵢ ≠ λⱼ\n\nStep 1:\n⟨χⱼ|Ĥ|χᵢ⟩ = λᵢ⟨χⱼ|χᵢ⟩  ... (1)\n\nStep 2: Take adjoint of ⟨χᵢ|Ĥ|χⱼ⟩ = λⱼ⟨χᵢ|χⱼ⟩\n⟨χⱼ|Ĥ†|χᵢ⟩ = λⱼ*⟨χⱼ|χᵢ⟩\n\nStep 3: Since Ĥ is Hermitian (Ĥ† = Ĥ) and eigenvalues are real (λⱼ* = λⱼ):\n⟨χⱼ|Ĥ|χᵢ⟩ = λⱼ⟨χⱼ|χᵢ⟩  ... (2)\n\nStep 4: Subtract (1) from (2):\n0 = (λⱼ - λᵢ)⟨χⱼ|χᵢ⟩\n\nSince λᵢ ≠ λⱼ, we must have ⟨χⱼ|χᵢ⟩ = 0\n\nConclusion: |χᵢ⟩ ⊥ |χⱼ⟩",
                topic: "Hermitian Operators - Orthogonality"
            },
            {
                question: "What is the trace of any Pauli matrix (σₓ, σᵧ, or σᵤ)?",
                correctAnswer: "0",
                acceptedAnswers: ["0", "zero"],
                hints: [
                    "The trace is the sum of diagonal elements. Write out any Pauli matrix and add its diagonal entries.",
                    "For σₓ=[[0,1],[1,0]], Tr(σₓ) = 0+0 = 0. Check this for σᵧ and σᵤ too!"
                ],
                solution: "The trace of all Pauli matrices is ZERO.\n\nVerification:\n\nσₓ = [[0,1],[1,0]]\nTr(σₓ) = 0 + 0 = 0 ✓\n\nσᵧ = [[0,-i],[i,0]]\nTr(σᵧ) = 0 + 0 = 0 ✓\n\nσᵤ = [[1,0],[0,-1]]\nTr(σᵤ) = 1 + (-1) = 0 ✓\n\nGeneral properties of Pauli matrices:\n1. Tr(σᵢ) = 0 for all i\n2. σᵢ² = I (identity)\n3. σᵢ† = σᵢ (Hermitian)\n4. det(σᵢ) = -1\n5. {σᵢ,σⱼ} = 2δᵢⱼI (anti-commutation)\n\nPhysical meaning: Pauli matrices represent spin-1/2 operators in quantum mechanics.",
                topic: "Pauli Matrices - Properties"
            },
            {
                question: "If eigenvalues of a skew-Hermitian operator can be written as iα (where α is real), what values can α take?",
                correctAnswer: "Any real number (including zero)",
                acceptedAnswers: ["real", "any real", "real number", "real or zero", "purely imaginary or zero"],
                hints: [
                    "Skew-Hermitian operators satisfy  = -Â†. What does this tell you about the eigenvalues?",
                    "For skew-Hermitian: λ = -λ*, which means eigenvalues are purely imaginary or zero. So λ = iα where α ∈ ℝ"
                ],
                solution: "For skew-Hermitian operators, eigenvalues are PURELY IMAGINARY or ZERO.\n\nProof:\nLet  be skew-Hermitian:  = -Â†\nWith Â|χ⟩ = λ|χ⟩\n\nStep 1:\n⟨χ|Â|χ⟩ = λ⟨χ|χ⟩  ... (1)\n\nStep 2: Take adjoint\n⟨χ|Â|χ⟩† = (λ⟨χ|χ⟩)†\n⟨χ|Â†|χ⟩ = λ*⟨χ|χ⟩  ... (2)\n\nStep 3: Use  = -Â†\n⟨χ|Â|χ⟩ = -λ*⟨χ|χ⟩  ... (3)\n\nStep 4: Compare (1) and (3)\nλ⟨χ|χ⟩ = -λ*⟨χ|χ⟩\nλ = -λ*\n\nThis means λ is purely imaginary or zero.\n\nWe can write: λ = iα where α ∈ ℝ (α can be any real number including 0)\n\nExample: i(Â + Â†) is skew-Hermitian when  is any operator.",
                topic: "Skew-Hermitian Operators"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let attempts = 0;
        let hintIndex = 0;

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showCompletionScreen();
                return;
            }

            const question = quizData[currentQuestionIndex];
            hintIndex = 0;

            const quizContent = document.getElementById('quiz-content');
            quizContent.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestionIndex + 1} of ${quizData.length} | Topic: ${question.topic}</div>
                    <div class="question-text">${question.question}</div>
                    <input type="text" class="answer-input" id="answer-input" placeholder="Enter your answer here..." />
                    <div>
                        <button class="btn btn-primary" onclick="checkAnswer()">Submit Answer</button>
                        <button class="btn btn-secondary" onclick="skipQuestion()">Skip Question</button>
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="solution" id="solution">
                        <h3>📖 Full Solution</h3>
                        <div class="solution-content">${formatSolution(question.solution)}</div>
                    </div>
                </div>
            `;

            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            updateProgress();

            // Focus on input
            document.getElementById('answer-input').focus();

            // Allow Enter key to submit
            document.getElementById('answer-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkAnswer();
            });
        }

        function formatSolution(solution) {
            return solution.split('\n').map(line => {
                if (line.trim().startsWith('Step') || line.trim().startsWith('•') || line.trim().match(/^\d+\./)) {
                    return `<p style="margin: 8px 0; padding-left: 10px;"><strong>${line}</strong></p>`;
                }
                return `<p style="margin: 8px 0;">${line}</p>`;
            }).join('');
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
            const question = quizData[currentQuestionIndex];
            const feedback = document.getElementById('feedback');

            if (!userAnswer) {
                feedback.className = 'feedback incorrect';
                feedback.style.display = 'block';
                feedback.innerHTML = '⚠️ Please enter an answer!';
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = attempts;

            // Check if answer is correct
            const isCorrect = question.acceptedAnswers.some(ans => 
                userAnswer.includes(ans.toLowerCase()) || ans.toLowerCase().includes(userAnswer)
            );

            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.className = 'feedback correct';
                feedback.style.display = 'block';
                feedback.innerHTML = '✅ <strong>Correct!</strong> Well done! Here\'s the complete solution:';

                // Show solution
                document.getElementById('solution').style.display = 'block';

                // Change button to next question
                document.querySelector('.btn-primary').textContent = 'Next Question →';
                document.querySelector('.btn-primary').onclick = nextQuestion;
                document.querySelector('.btn-secondary').style.display = 'none';

            } else {
                // Incorrect - show hint
                if (hintIndex < question.hints.length) {
                    feedback.className = 'feedback hint';
                    feedback.style.display = 'block';
                    feedback.innerHTML = `💡 <strong>Hint ${hintIndex + 1}:</strong> ${question.hints[hintIndex]}`;
                    hintIndex++;
                } else {
                    // No more hints - show solution
                    feedback.className = 'feedback incorrect';
                    feedback.style.display = 'block';
                    feedback.innerHTML = '❌ <strong>Incorrect.</strong> Here\'s the complete solution:';
                    document.getElementById('solution').style.display = 'block';

                    // Change button to next question
                    document.querySelector('.btn-primary').textContent = 'Next Question →';
                    document.querySelector('.btn-primary').onclick = nextQuestion;
                    document.querySelector('.btn-secondary').style.display = 'none';
                }
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function skipQuestion() {
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback hint';
            feedback.style.display = 'block';
            feedback.innerHTML = '⏭️ <strong>Question skipped.</strong> Here\'s the solution for your reference:';
            document.getElementById('solution').style.display = 'block';

            document.querySelector('.btn-primary').textContent = 'Next Question →';
            document.querySelector('.btn-primary').onclick = nextQuestion;
            document.querySelector('.btn-secondary').style.display = 'none';
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function showCompletionScreen() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('total-questions').textContent = quizData.length;
            document.getElementById('progress').style.width = '100%';
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            attempts = 0;
            hintIndex = 0;

            document.getElementById('score').textContent = '0';
            document.getElementById('attempts').textContent = '0';
            document.getElementById('quiz-content').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('hidden');

            loadQuestion();
        }

        // Initialize quiz on page load
        window.onload = function() {
            loadQuestion();
        };
