    const quizData = [

        // =========================

                "A†A = I"

            correctIndex: 0,
            hints: [
                "Linearity means preserving addition and scalar multiplication.",
                "Look for the rule that distributes over a linear combination."

            solution: "A is linear if it preserves linear combinations: A(α|ψ⟩ + β|φ⟩) = αA|ψ⟩ + βA|φ⟩."

        {
            topic: "Linear Operators",
            question: "Which mapping is NOT linear (as an operator on functions f)?",

            correctIndex: 3,
            hints: [
                "Test linearity using L(f+g) ?= L(f)+L(g).",
                "Squaring usually breaks additivity."
            ],
            solution: "L(f)=f^2 is not linear because (f+g)^2 ≠ f^2 + g^2 in general."
        },
        {
            topic: "Linear Operators",

                "Use A(0) = A(0 + 0) = A(0) + A(0).",

        },
        {
            topic: "Linear Operators",

            ],
            correctIndex: 0,
            hints: [

            ],

        },
        {
            topic: "Linear Operators",
            question: "The zero operator Z defined by Z|ψ⟩ = 0 is:",

                "Linear",

                "Always invertible"
            ],

            hints: [
                "Check Z(α|ψ⟩+β|φ⟩).",

        },
        {
            topic: "Linear Operators",
            question: "Which is a correct matrix form for a linear operator on ℝ^n?",

            correctIndex: 0,
            hints: [
                "Linear maps correspond to matrices once a basis is fixed.",

        },
        {
            topic: "Linear Operators",

            correctIndex: 0,
            hints: [
                "This is the homogeneity part of linearity.",

        {
            topic: "Linear Operators",

            question: "Which is true for determinants?",
            options: [

            solution: "A standard property: tr(AB)=tr(BA)."
        },
        {
            topic: "Matrix Algebra",
            question: "Transpose of a product satisfies:",
            options: [

                "(AB)ᵀ = A + B"

            correctIndex: 0,
            hints: [

            solution: "(AB)ᵀ = BᵀAᵀ."
        },
        {
            topic: "Matrix Algebra",
            question: "Conjugate-transpose (dagger) of a product satisfies:",
            options: [
                "(AB)† = B† A†",
                "(AB)† = A† B†",
                "(AB)† = AB",
                "(AB)† = A + B"
            ],
            correctIndex: 0,
            hints: [
                "Dagger is like transpose + complex conjugate, order reverses.",
                "Same pattern as transpose."
            ],
            solution: "(AB)† = B†A†."
        },
        {
            topic: "Matrix Algebra",
            question: "For a 2×2 matrix [[a,b],[c,d]], det(A) equals:",
            options: [
                "ad − bc",
                "ab − cd",
                "a + d",
                "b + c"
            ],
            correctIndex: 0,
            hints: [
                "Use the standard 2×2 determinant formula.",
                "Multiply diagonal and subtract off-diagonal product."
            ],
            solution: "det([[a,b],[c,d]]) = ad − bc."
        },
        {
            topic: "Matrix Algebra",
            question: "For any square matrix A, the trace is:",
            options: [
                "Sum of diagonal elements",
                "Product of diagonal elements",
                "Always 0",
                "Always 1"
            ],
            correctIndex: 0,
            hints: [
                "Trace is a simple scalar built from diagonals.",
                "Write A = (a_ij); trace = Σ a_ii."
            ],
            solution: "Trace is the sum of diagonal elements."
        },
        {
            topic: "Matrix Algebra",
            question: "If A is diagonal with diagonal entries (2, 5, -1), its eigenvalues are:",
            options: [
                "2, 5, -1",
                "Only 2",
                "Only 5",
                "2+5-1 = 6"
            ],
            correctIndex: 0,
            hints: [
                "Diagonal matrices act independently on basis vectors.",
                "Each diagonal entry is an eigenvalue."
            ],
            solution: "Eigenvalues of a diagonal matrix are its diagonal entries."
        },
        {
            topic: "Matrix Algebra",
            question: "For an orthogonal matrix Q (real case), the defining relation is:",
            options: [
                "QᵀQ = I",
                "Q†Q = 0",
                "Q = Q† always",
                "det(Q) = 0"
            ],
            correctIndex: 0,
            hints: [
                "Orthogonal matrices preserve dot products.",
                "Inverse equals transpose."

        // ==========================================

        // ==========================================

            topic: "Hermitian, Unitary & Projection",

            options: [
                "H = H†",
                "H†H = I",
                "H² = H",

            correctIndex: 0,
            hints: [
                "Hermitian means equal to conjugate transpose.",
                "Look for H equals H dagger."

        {
            topic: "Hermitian, Unitary & Projection",

                "U†U = I",

            hints: [

            topic: "Hermitian, Unitary & Projection",

            correctIndex: 0,
            hints: [
                "Projecting twice gives the same as once.",

        {
            topic: "Hermitian, Unitary & Projection",

    // State
    let currentQuestionIndex = 0;
    let score = 0;
    let attempts = 0;
    let hintIndex = 0;
    let locked = false;

    const letters = ["A", "B", "C", "D"];

    function loadQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            showCompletionScreen();
            return;
        }

        const question = quizData[currentQuestionIndex];
        hintIndex = 0;
        locked = false;

        const optionsHTML = question.options.map((opt, i) => {
            const label = letters[i] ? letters[i] + ") " : "";
            return `<button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">${label}${escapeHtml(opt)}</button>`;
        }).join("");

        const quizContent = document.getElementById('quiz-content');
        quizContent.innerHTML = `
            <div class="question-card">
                <div class="question-number">Question ${currentQuestionIndex + 1} of ${quizData.length} | Topic: ${escapeHtml(question.topic)}</div>
                <div class="question-text">${question.question}</div>

                <div class="options">
                    ${optionsHTML}
                </div>

                <div>
                    <button class="btn btn-secondary" id="skip-btn" onclick="skipQuestion()">Skip Question</button>
                    <button class="btn btn-primary hidden" id="next-btn" onclick="nextQuestion()">Next Question →</button>
                </div>

                <div class="feedback" id="feedback"></div>

                <div class="solution" id="solution">
                    <h3>📖 Full Solution</h3>
                    <div class="solution-content">${formatSolution(question.solution)}</div>
                </div>
            </div>
        `;

        document.getElementById('current-question').textContent = currentQuestionIndex + 1;
        updateProgress();
    }

    function escapeHtml(str) {
        // Only used for option/topic text; question string intentionally allows formatting if you add it.
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    function formatSolution(solution) {
        return solution.split('\n').map(line => {
            if (line.trim().startsWith('Step') || line.trim().startsWith('•') || line.trim().match(/^\d+\./)) {
                return `<p style="margin: 8px 0; padding-left: 10px;"><strong>${escapeHtml(line)}</strong></p>`;
            }
            return `<p style="margin: 8px 0;">${escapeHtml(line)}</p>`;
        }).join('');
    }

    function setButtonsDisabled(disabled) {
        const question = quizData[currentQuestionIndex];
        for (let i = 0; i < question.options.length; i++) {
            const btn = document.getElementById(`opt-${i}`);
            if (btn) btn.disabled = disabled;
        }
    }

    function showNextOnly() {
        const nextBtn = document.getElementById("next-btn");
        const skipBtn = document.getElementById("skip-btn");
        if (nextBtn) nextBtn.classList.remove("hidden");
        if (skipBtn) skipBtn.classList.add("hidden");
    }

    function selectOption(index) {
        if (locked) return;

        const question = quizData[currentQuestionIndex];
        const feedback = document.getElementById('feedback');

        attempts++;
        document.getElementById('attempts').textContent = attempts;

        const clickedBtn = document.getElementById(`opt-${index}`);

        if (index === question.correctIndex) {
            locked = true;
            score++;
            document.getElementById('score').textContent = score;

            if (clickedBtn) clickedBtn.classList.add("correct");

            feedback.className = 'feedback correct';
            feedback.style.display = 'block';
            feedback.innerHTML = '✅ <strong>Correct!</strong> Well done! Here is the complete solution:';

            document.getElementById('solution').style.display = 'block';
            setButtonsDisabled(true);
            showNextOnly();
            return;
        }

        // Wrong answer
        if (clickedBtn) clickedBtn.classList.add("wrong");

        if (hintIndex < question.hints.length) {
            feedback.className = 'feedback hint';
            feedback.style.display = 'block';
            feedback.innerHTML = `💡 <strong>Hint ${hintIndex + 1}:</strong> ${escapeHtml(question.hints[hintIndex])}`;
            hintIndex++;
        } else {
            locked = true;
            feedback.className = 'feedback incorrect';
            feedback.style.display = 'block';
            feedback.innerHTML = '❌ <strong>Incorrect.</strong> Here is the complete solution:';

            // highlight correct option
            const correctBtn = document.getElementById(`opt-${question.correctIndex}`);
            if (correctBtn) correctBtn.classList.add("correct");

            document.getElementById('solution').style.display = 'block';
            setButtonsDisabled(true);
            showNextOnly();
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function skipQuestion() {
        if (locked) return;

        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback hint';
        feedback.style.display = 'block';
        feedback.innerHTML = '⏭️ <strong>Question skipped.</strong> Here is the solution for your reference:';

        const question = quizData[currentQuestionIndex];
        const correctBtn = document.getElementById(`opt-${question.correctIndex}`);
        if (correctBtn) correctBtn.classList.add("correct");

        document.getElementById('solution').style.display = 'block';
        locked = true;
        setButtonsDisabled(true);
        showNextOnly();
    }

    function updateProgress() {
        const progress = (currentQuestionIndex / quizData.length) * 100;
        document.getElementById('progress').style.width = progress + '%';
    }

    function showCompletionScreen() {
        document.getElementById('quiz-content').classList.add('hidden');
        document.getElementById('completion-screen').classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
        document.getElementById('total-questions').textContent = quizData.length;
        document.getElementById('progress').style.width = '100%';
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        attempts = 0;
        hintIndex = 0;
        locked = false;

        document.getElementById('score').textContent = '0';
        document.getElementById('attempts').textContent = '0';
        document.getElementById('quiz-content').classList.remove('hidden');
        document.getElementById('completion-screen').classList.add('hidden');

        loadQuestion();
    }

    window.onload = function() {
        loadQuestion();
    };
</script>
