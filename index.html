<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Engineering Physics Quiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 980px; margin: 0 auto; background: white;
      border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 30px;
    }
    h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 18px; font-size: 0.95em; }
    .stats {
      display: flex; justify-content: space-around;
      margin: 16px 0 20px 0; padding: 15px;
      background: #f8f9fa; border-radius: 8px; gap: 10px; flex-wrap: wrap;
    }
    .stat-item { text-align: center; min-width: 140px; }
    .stat-value { font-size: 1.8em; font-weight: bold; color: #667eea; }
    .stat-label { color: #666; font-size: 0.9em; }
    .progress-bar {
      background: #f0f0f0; height: 10px;
      border-radius: 5px; margin-bottom: 20px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }
    .hidden { display: none; }
    .topic-screen {
      background: #f8f9fa; padding: 22px; border-radius: 12px;
      border-left: 5px solid #667eea; margin-bottom: 20px;
    }
    .topic-title { color: #333; font-size: 1.2em; margin-bottom: 8px; text-align: center; }
    .topic-subtitle { color: #666; text-align: center; margin-bottom: 16px; font-size: 0.95em; }
    .topic-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
    @media (min-width: 780px) { .topic-grid { grid-template-columns: 1fr 1fr; } }
    .topic-card {
      background: #ffffff; border: 2px solid #ddd;
      border-radius: 12px; padding: 14px 16px; transition: all 0.2s ease;
    }
    .topic-card:hover {
      border-color: #667eea;
      box-shadow: 0 3px 12px rgba(102,126,234,0.18);
      transform: translateY(-1px);
    }
    .topic-card .meta { display: block; color: #666; margin-top: 6px; font-size: 0.9em; line-height: 1.35em; }
    .topic-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .question-card {
      background: #f8f9fa; padding: 25px; border-radius: 10px;
      margin-bottom: 20px; border-left: 5px solid #667eea;
    }
    .question-number { color: #667eea; font-weight: bold; margin-bottom: 10px; line-height: 1.4em; }
    .question-text { font-size: 1.1em; line-height: 1.6; margin-bottom: 18px; color: #333; white-space: pre-line; }
    .options { margin-bottom: 10px; }
    .option-btn {
      width: 100%; text-align: left; background: #ffffff; border: 2px solid #ddd;
      border-radius: 10px; padding: 12px 14px; font-size: 1em; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 10px;
    }
    .option-btn:hover {
      border-color: #667eea;
      box-shadow: 0 3px 12px rgba(102,126,234,0.18);
      transform: translateY(-1px);
    }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.88; }
    .option-btn.correct { border-color: #28a745; background: #d4edda; }
    .option-btn.wrong   { border-color: #dc3545; background: #f8d7da; }
    .btn {
      padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 1em; font-weight: 600; transition: all 0.3s;
      margin-right: 10px; margin-top: 10px;
    }
    .btn-small { padding: 10px 14px; margin-right: 0; margin-top: 0; font-size: 0.95em; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .feedback { padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
    .feedback.correct   { background: #d4edda; border: 2px solid #28a745; color: #155724; }
    .feedback.incorrect { background: #f8d7da; border: 2px solid #dc3545; color: #721c24; }
    .feedback.hint      { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }
    .solution {
      background: #e7f3ff; padding: 20px; border-radius: 8px;
      margin-top: 15px; border-left: 5px solid #2196F3; display: none;
    }
    .solution h3 { color: #2196F3; margin-bottom: 10px; }
    .solution-content { line-height: 1.75; color: #333; }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      background: #eef2ff; color: #3b4cca; font-weight: 600;
      font-size: 0.9em; margin-left: 6px;
    }
    .slides-panel {
      margin-top: 18px; background: #ffffff; border: 2px solid #ddd;
      border-radius: 12px; padding: 14px;
    }
    .slides-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .slides-title  { color: #333; font-size: 1.05em; font-weight: 700; }
    .slides-subtitle { color: #666; font-size: 0.92em; margin-top: 2px; }
    .slides-frame {
      width: 100%; height: 650px; border: 2px solid #ddd;
      border-radius: 12px; background: #f8f9fa;
    }
    .note { color: #666; font-size: 0.9em; margin-top: 8px; text-align: center; }
    
    /* ── Module grouping ── */
.module-section {
  margin-bottom: 24px;
}

.module-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 10px 18px;
  border-radius: 10px;
  margin-bottom: 12px;
}

.module-header .mod-title {
  font-weight: 700;
  font-size: 1.05em;
}

.module-header .mod-meta {
  font-size: 0.85em;
  opacity: 0.88;
}

.module-empty {
  color: #999;
  font-style: italic;
  font-size: 0.92em;
  padding: 6px 4px;
}
  </style>
</head>

<body>
<div class="container">
  <h1>🎓 Engineering Physics Quiz</h1>
  <div class="subtitle">BAPHY105 — All Modules</div>

  <div class="stats">
    <div class="stat-item"><div class="stat-value" id="stat-topic">—</div><div class="stat-label">Current Topic</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-q">—</div><div class="stat-label">Question</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-score">0</div><div class="stat-label">Score</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-attempts">0</div><div class="stat-label">Attempts</div></div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>

  <!-- Topic selection -->
  <div id="topic-screen" class="topic-screen">
    <div class="topic-title">Choose a topic</div>
    <div class="topic-subtitle">Options are shuffled every time.</div>
    <div id="topic-buttons"></div>
    <div style="text-align:center;">
      <button class="btn btn-primary"   id="start-all-btn">Start Full Quiz (All Topics)</button>
      <button class="btn btn-secondary" id="reset-scores-btn">Reset Saved Scores</button>
    </div>

    <!-- PDF.js slides viewer -->
    <div id="slides-panel" class="slides-panel hidden">
      <div class="slides-header">
        <div>
          <div class="slides-title">Slides Viewer</div>
          <div class="slides-subtitle" id="slides-topic">—</div>
        </div>
        <div class="topic-actions" style="margin-top:0;">
          <a  class="btn btn-primary btn-small"   id="slides-download"  href="#" download>Download PDF</a>
          <a  class="btn btn-secondary btn-small" id="slides-open-pdf"  href="#" target="_blank" rel="noopener">Open PDF</a>
          <button class="btn btn-secondary btn-small" id="slides-close-btn" type="button">Close</button>
        </div>
      </div>
      <iframe id="slides-frame" class="slides-frame" src="" loading="lazy" title="PDF.js viewer"></iframe>
    </div>
  </div>

  <!-- Quiz content -->
  <div id="quiz-content" class="hidden"></div>

  <!-- Completion -->
  <div id="completion-screen" class="hidden">
    <h2 style="text-align:center;color:#667eea;margin-bottom:12px;">🎉 Quiz Completed!</h2>
    <div class="stats">
      <div class="stat-item"><div class="stat-value" id="final-topic">—</div><div class="stat-label">Topic</div></div>
      <div class="stat-item"><div class="stat-value" id="final-score">0</div><div class="stat-label">Score</div></div>
      <div class="stat-item"><div class="stat-value" id="final-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat-item"><div class="stat-value" id="final-accuracy">0%</div><div class="stat-label">Accuracy</div></div>
    </div>
    <div style="text-align:center;margin-top:6px;">
      <button class="btn btn-secondary" onclick="backToTopics()">Back to Topics</button>
      <button class="btn btn-primary"   onclick="restartSameTopic()">Retry Same Topic</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     STEP 1 — shared containers  (modules push into these)
     ══════════════════════════════════════════════════ -->
<script>
  /* Syllabus modules — fixed, matches BAPHY105 */
  const MODULES = [
    { key: "Module1", label: "Wave-Particle Duality",               },
    { key: "Module2", label: "Mathematical Foundations of QM",      },
    { key: "Module3", label: "Postulates of Quantum Mechanics",     },
    { key: "Module4", label: "Applications of Quantum Mechanics",   },
    { key: "Module5", label: "Elements of Quantum Computing",       }
  ];

  const TOPICS       = [];   /* question files push into this */
  const TOPIC_SLIDES = {};
  const QUESTIONS    = [];
</script>

<!-- ══════════════════════════════════════════════════
     STEP 2 — load each question module
     ══════════════════════════════════════════════════ -->
<script src="questions/module1.js"></script>
<script src="questions/module2.js"></script>
<script src="questions/module3.js"></script>
<script src="questions/module4.js"></script>
<script src="questions/module5.js"></script>

<!-- ══════════════════════════════════════════════════
     STEP 3 — app logic  (runs after all modules loaded)
     ══════════════════════════════════════════════════ -->
<script>
  const letters     = ["A","B","C","D"];
  const STORAGE_KEY = "baphy105_scorecard_v1";

  function escapeHtml(s) {
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  }
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function shuffledQuestionView(q) {
    const items = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correctIndex }));
    shuffleArray(items);
    return { options: items.map(x => x.text), correctIndex: items.findIndex(x => x.isCorrect) };
  }
  function loadScorecard() {
    try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY)); return (d && typeof d==="object") ? d : {}; }
    catch { return {}; }
  }
  function saveScorecard(sc)  { localStorage.setItem(STORAGE_KEY, JSON.stringify(sc)); }
  function resetScorecard()   { localStorage.removeItem(STORAGE_KEY); }
  function pct(n, d)          { return d ? Math.round(100*n/d)+"%" : "0%"; }

  /* ── state ── */
  let activeTopicKey = null, activeQuestions = [], currentQuestionIndex = 0;
  let score = 0, attempts = 0, hintIndex = 0, locked = false;
  let viewOptions = [], viewCorrectIndex = -1;
  let scorecard = loadScorecard();

  /* ── slides ── */
  function pdfJsViewerUrl(path) {
    return "pdfjs/web/viewer.html?file=" + encodeURIComponent(new URL(path, window.location.href).href);
  }
  function openSlides(key) {
    const p = TOPIC_SLIDES[key];
    if (!p) { alert("Slides not linked for this topic yet."); return; }
    const panel = document.getElementById("slides-panel");
    panel.classList.remove("hidden");
    document.getElementById("slides-topic").textContent  = key + " — " + p.split("/").pop();
    document.getElementById("slides-frame").src          = pdfJsViewerUrl(p);
    document.getElementById("slides-download").href      = p;
    document.getElementById("slides-open-pdf").href      = p;
    panel.scrollIntoView({ behavior:"smooth", block:"start" });
  }
  function closeSlides() {
    document.getElementById("slides-frame").src = "";
    document.getElementById("slides-panel").classList.add("hidden");
  }

  /* ── topic menu ── */
  function buildTopicMenu() {
  const wrap = document.getElementById("topic-buttons");
  wrap.innerHTML = "";

  MODULES.forEach(mod => {
    const modTopics = TOPICS.filter(t => t.moduleKey === mod.key);

    const section = document.createElement("div");
    section.className = "module-section";

    /* ── module header ── */
    const header = document.createElement("div");
    header.className = "module-header";
    header.innerHTML = `
      <span class="mod-title">${escapeHtml(mod.key)}: ${escapeHtml(mod.label)}</span>
      <span class="mod-meta">${mod.hours} hrs</span>`;
    section.appendChild(header);

    if (modTopics.length === 0) {
      /* placeholder for modules with no questions yet */
      const empty = document.createElement("div");
      empty.className = "module-empty";
      empty.textContent = "No questions added yet for this module.";
      section.appendChild(empty);
      wrap.appendChild(section);
      return;
    }

    /* ── topic grid ── */
    const grid = document.createElement("div");
    grid.className = "topic-grid";

    modTopics.forEach(t => {
      const count = QUESTIONS.filter(q => q.topic === t.key).length;
      const sc    = scorecard[t.key] || {};
      const last  = typeof sc.lastScore === "number" ? sc.lastScore+"/"+sc.lastTotal : "—";
      const best  = typeof sc.bestScore === "number" ? sc.bestScore+"/"+sc.bestTotal : "—";
      const pdf   = TOPIC_SLIDES[t.key] || "";

      const card = document.createElement("div");
      card.className = "topic-card";
      card.innerHTML = `
        <div><strong>${escapeHtml(t.label)}</strong><span class="pill">${count} Q</span></div>
        <span class="meta">Last: ${escapeHtml(last)} | Best: ${escapeHtml(best)}</span>
        <span class="meta">Slides: ${pdf ? escapeHtml(pdf.split("/").pop()) : "Not linked"}</span>
        <div class="topic-actions">
          <button class="btn btn-primary   btn-small" data-action="start">Start Quiz</button>
          <button class="btn btn-secondary btn-small" data-action="view" ${pdf?"":"disabled"}>View Slides</button>
        </div>`;
      card.querySelector('[data-action="start"]').addEventListener("click", () => startTopic(t.key));
      card.querySelector('[data-action="view"]' ).addEventListener("click", () => openSlides(t.key));
      grid.appendChild(card);
    });

    section.appendChild(grid);
    wrap.appendChild(section);
  });

  document.getElementById("start-all-btn").onclick    = startAllTopics;
  document.getElementById("reset-scores-btn").onclick = () => {
    if (confirm("Reset all saved topic scores?")) {
      resetScorecard(); scorecard = loadScorecard(); buildTopicMenu();
    }
  };
}
  function showTopicScreen() {
    document.getElementById("topic-screen").classList.remove("hidden");
    document.getElementById("quiz-content").classList.add("hidden");
    document.getElementById("completion-screen").classList.add("hidden");
    document.getElementById("progress").style.width = "0%";
    setTopStats("—","—",0,0);
  }

  /* ── start / restart ── */
  function resetRunStats() {
    currentQuestionIndex = score = attempts = hintIndex = 0; locked = false;
    document.getElementById("stat-score").textContent    = "0";
    document.getElementById("stat-attempts").textContent = "0";
  }
  function startTopic(key) {
    closeSlides(); activeTopicKey = key;
    activeQuestions = QUESTIONS.filter(q => q.topic === key);
    shuffleArray(activeQuestions); resetRunStats();
    document.getElementById("topic-screen").classList.add("hidden");
    document.getElementById("quiz-content").classList.remove("hidden");
    loadQuestion();
  }
  function startAllTopics() {
    closeSlides(); activeTopicKey = "__ALL__";
    activeQuestions = [...QUESTIONS]; shuffleArray(activeQuestions); resetRunStats();
    document.getElementById("topic-screen").classList.add("hidden");
    document.getElementById("quiz-content").classList.remove("hidden");
    loadQuestion();
  }
  function restartSameTopic() { activeTopicKey==="__ALL__" ? startAllTopics() : startTopic(activeTopicKey); }
  function backToTopics()     { buildTopicMenu(); showTopicScreen(); }

  /* ── quiz rendering ── */
  function setTopStats(topic, q, s, a) {
    document.getElementById("stat-topic").textContent    = topic;
    document.getElementById("stat-q").textContent        = q;
    document.getElementById("stat-score").textContent    = String(s);
    document.getElementById("stat-attempts").textContent = String(a);
  }
  function updateProgress() {
    document.getElementById("progress").style.width =
      (currentQuestionIndex / activeQuestions.length * 100) + "%";
  }
  function formatSolution(sol) {
    return sol.split("\n").map(line => {
      const t = line.trim();
      if (t.startsWith("Step") || t.startsWith("•") || /^\d+\./.test(t))
        return `<p style="margin:8px 0;padding-left:10px;"><strong>${escapeHtml(line)}</strong></p>`;
      return `<p style="margin:8px 0;">${escapeHtml(line)}</p>`;
    }).join("");
  }
  function loadQuestion() {
    if (currentQuestionIndex >= activeQuestions.length) { showCompletionScreen(); return; }
    const q = activeQuestions[currentQuestionIndex];
    hintIndex = 0; locked = false;
    const view = shuffledQuestionView(q);
    viewOptions = view.options; viewCorrectIndex = view.correctIndex;

    const opts = viewOptions.map((opt,i) =>
      `<button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">${letters[i]}) ${escapeHtml(opt)}</button>`
    ).join("");
    const topicDisplay = activeTopicKey==="__ALL__" ? "All Topics" : q.topic;
    setTopStats(topicDisplay, `${currentQuestionIndex+1}/${activeQuestions.length}`, score, attempts);

    document.getElementById("quiz-content").innerHTML = `
      <div class="question-card">
        <div class="question-number">Question ${currentQuestionIndex+1} of ${activeQuestions.length} | Topic: ${escapeHtml(q.topic)}</div>
        <div class="question-text">${escapeHtml(q.question)}</div>
        <div class="options">${opts}</div>
        <div>
          <button class="btn btn-secondary" onclick="backToTopics()">Change Topic</button>
          <button class="btn btn-secondary" id="skip-btn" onclick="skipQuestion()">Skip</button>
          <button class="btn btn-primary hidden" id="next-btn" onclick="nextQuestion()">Next →</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="solution" id="solution">
          <h3>📖 Full Solution</h3>
          <div class="solution-content">${formatSolution(q.solution)}</div>
        </div>
      </div>`;
    updateProgress();
  }
  function setButtonsDisabled(d) {
    for (let i=0;i<4;i++) { const b=document.getElementById(`opt-${i}`); if(b) b.disabled=d; }
  }
  function showNextOnly() {
    const n=document.getElementById("next-btn"), s=document.getElementById("skip-btn");
    if(n) n.classList.remove("hidden");
    if(s) s.classList.add("hidden");
  }
  function selectOption(index) {
    if (locked) return;
    const q = activeQuestions[currentQuestionIndex];
    const fb = document.getElementById("feedback");
    attempts++;
    document.getElementById("stat-attempts").textContent = String(attempts);
    const btn = document.getElementById(`opt-${index}`);

    if (index === viewCorrectIndex) {
      locked = true; score++;
      document.getElementById("stat-score").textContent = String(score);
      if (btn) btn.classList.add("correct");
      fb.className = "feedback correct"; fb.textContent = "✅ Correct!"; fb.style.display = "block";
      const sol = document.getElementById("solution"); if(sol) sol.style.display = "block";
      setButtonsDisabled(true); showNextOnly();
    } else {
      if (btn) btn.classList.add("wrong");
      const hint = q.hints && q.hints[hintIndex] ? q.hints[hintIndex] : null;
      hintIndex = Math.min(hintIndex+1, (q.hints||[]).length);
      fb.className   = hint ? "feedback hint" : "feedback incorrect";
      fb.textContent = hint ? `💡 Hint: ${hint}` : "❌ Incorrect. Try again!";
      fb.style.display = "block";
    }
  }
  function skipQuestion() {
    const fb = document.getElementById("feedback");
    fb.className   = "feedback incorrect";
    fb.textContent = `⏭ Skipped. Answer: ${letters[viewCorrectIndex]}) ${viewOptions[viewCorrectIndex]}`;
    fb.style.display = "block";
    const sol = document.getElementById("solution"); if(sol) sol.style.display = "block";
    setButtonsDisabled(true); showNextOnly();
  }
  function nextQuestion() { currentQuestionIndex++; loadQuestion(); }

  function showCompletionScreen() {
    const label = activeTopicKey==="__ALL__"
      ? "All Topics"
      : (TOPICS.find(t=>t.key===activeTopicKey)||{}).label || activeTopicKey;
    document.getElementById("final-topic").textContent    = label;
    document.getElementById("final-score").textContent    = String(score);
    document.getElementById("final-total").textContent    = String(activeQuestions.length);
    document.getElementById("final-accuracy").textContent = pct(score, attempts);

    if (activeTopicKey !== "__ALL__") {
      const sc = scorecard[activeTopicKey] || {};
      sc.lastScore = score; sc.lastTotal = activeQuestions.length;
      if (typeof sc.bestScore !== "number" || score > sc.bestScore) {
        sc.bestScore = score; sc.bestTotal = activeQuestions.length;
      }
      scorecard[activeTopicKey] = sc; saveScorecard(scorecard);
    }
    document.getElementById("topic-screen").classList.add("hidden");
    document.getElementById("quiz-content").classList.add("hidden");
    document.getElementById("completion-screen").classList.remove("hidden");
    document.getElementById("progress").style.width = "100%";
  }

  /* ── init ── */
  buildTopicMenu();
  showTopicScreen();
  document.getElementById("slides-close-btn").addEventListener("click", closeSlides);
</script>
</body>
</html>
